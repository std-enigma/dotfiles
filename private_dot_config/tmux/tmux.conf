# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# General
set -g mouse on
set -g mode-keys vi
set -g set-clipboard on
set -g history-limit 10000

# Windows / panes start at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keybindings
bind Q confirm-before -p "Kill tmux server? (y/n)" kill-server

# Status bar: use terminal defaults so it follows your terminal theme
set -g status-position top
set -g status-style 'bg=default,fg=default'
set -g message-style 'bg=default,fg=default'
set -g pane-border-style 'fg=default'
set -g pane-active-border-style 'fg=colour6'

set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-interval 5

# Left: session name
set -g status-left ' #[bold]#S#[nobold] '

# Center: windows; active window gets a simple reverse-video highlight
setw -g window-status-format '  #I:#W  '
setw -g window-status-current-format ' #[reverse,bold] #I:#W #[noreverse,nobold] '
setw -g window-status-separator ''

# Right: host and clock
set -g status-right ' #[dim]#H#[nondim]  %H:%M '

# Reload config with Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @plugin 'tmux-plugins/tmux-open'

# Search selected text on Google with Shift-s
set -g @open-S 'https://www.google.com/search?q='

# TPM must be the final line
run '~/.config/tmux/plugins/tpm/tpm'
