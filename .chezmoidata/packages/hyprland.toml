  "pipewire", "wireplumber", "pipewire-pulse",
  "qt5-wayland", "qt6-wayland",
  "brightnessctl", "grim", "slurp", "cliphist",
  "networkmanager", "bluez", "bluez-utils",
  "thunar", "gvfs",
]
aur = []
